<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e1e5eb;
    --blue: #1f5fd1; --green: #138a4a; --red: #c8322b; --amber: #b86e00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: #10213f; color: #fff; }
  header h1 { flex: 1; margin: 0; font-size: 18px; }
  header .who { font-size: 13px; opacity: .85; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  label.f { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 14px; }
  input[type=text], input[type=tel], input[type=password], textarea {
    width: 100%; padding: 12px; font: inherit; border: 1px solid #c9d0da; border-radius: 8px; background: #fff; }
  textarea { min-height: 72px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips span { display: inline-block; padding: 9px 14px; border: 1px solid #c9d0da; border-radius: 999px; background: #fff; cursor: pointer; }
  .chips input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  .btn-main { width: 100%; margin-top: 16px; padding: 16px; font-size: 17px; background: var(--blue); color: #fff; }
  .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); padding: 6px 10px; font-size: 13px; }
  .btn-line { background: #fff; color: var(--text); border: 1px solid #c9d0da; }
  .role { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role button { padding: 22px 8px; font-size: 18px; background: #fff; border: 2px solid var(--line); color: var(--text); }
  .role button.on { border-color: var(--blue); background: #eaf1fd; color: var(--blue); }
  .muted { color: var(--muted); font-size: 13px; }
  .req-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .req-id { font-weight: 800; font-size: 17px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 700; background: #eef1f5; margin-right: 4px; }
  .tag.type { background: #fde8e7; color: var(--red); }
  .cond { margin: 8px 0; white-space: pre-wrap; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .actions button { padding: 14px 4px; color: #fff; }
  .a-accept { background: var(--green); } .a-reject { background: var(--red); } .a-call { background: var(--amber); }
  .resp { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .resp .name { flex: 1; font-weight: 600; }
  .st { font-weight: 800; font-size: 14px; }
  .st.accept { color: var(--green); } .st.reject { color: var(--red); } .st.call { color: var(--amber); }
  .resp button { padding: 8px 10px; font-size: 14px; background: var(--green); color: #fff; }
  .done { opacity: .75; }
  .banner { padding: 10px 12px; border-radius: 8px; font-weight: 700; margin-top: 10px; }
  .banner.ok { background: #e3f5ea; color: var(--green); }
  .banner.info { background: #eef1f5; color: var(--muted); }
  .new { animation: flash 1s ease 3; }
  @keyframes flash { 50% { box-shadow: 0 0 0 4px #f5b301; } }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b1f24; color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; z-index: 10; max-width: 90%; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }
  a.tel { color: var(--blue); font-weight: 700; }
  .alarm { position: sticky; top: 52px; z-index: 4; margin-bottom: 14px; padding: 14px; border-radius: 10px;
    background: var(--red); color: #fff; font-weight: 800; text-align: center; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { background: #7a1410; } }
  .card.pending { border: 2px solid var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🚑 환자 수용 요청</h1>
  <span class="who" id="who"></span>
  <button class="btn-ghost hidden" id="btnSettings">설정</button>
</header>

<main>
  <!-- 처음 접속: 역할 선택 -->
  <section id="setup" class="hidden">
    <div class="card">
      <h2>사용자 선택</h2>
      <div class="role">
        <button data-role="police">👮 경찰관</button>
        <button data-role="hospital">🏥 병원</button>
      </div>

      <div id="setupPolice" class="hidden">
        <label class="f">소속 / 이름</label>
        <input type="text" id="sOfficer" placeholder="예: OO지구대 홍길동 경위">
        <label class="f">회신 연락처</label>
        <input type="tel" id="sContact" placeholder="예: 010-0000-0000">
      </div>

      <div id="setupHospital" class="hidden">
        <label class="f">병원명</label>
        <input type="text" id="sHospital" placeholder="예: OO대학교병원 응급실">
        <label class="f">요청을 받을 지역 (선택 안 하면 전체)</label>
        <div class="chips" id="sRegions"></div>
      </div>

      <div id="setupCode" class="hidden">
        <label class="f">접속 코드</label>
        <input type="password" id="sCode" placeholder="관리자에게 받은 코드">
      </div>

      <button class="btn-main" id="btnStart" disabled>시작하기</button>
      <p class="muted">⚠ 시험 운영 중입니다. 환자 이름·주민번호 등 개인식별정보는 입력하지 마세요.</p>
    </div>
  </section>

  <!-- 경찰관 화면 -->
  <section id="police" class="hidden">
    <div class="card">
      <h2>새 수용 요청</h2>
      <label class="f">환자 유형</label>
      <div class="chips" id="pType"></div>
      <label class="f">지역</label>
      <div class="chips" id="pRegion"></div>
      <label class="f">환자 상태 (식별정보 제외)</label>
      <textarea id="pCond" maxlength="300" placeholder="예: 40대 남성, 의식 명료, 보행 곤란, 이마 열상"></textarea>
      <button class="btn-main" id="btnSend">📣 참여 병원 전체에 요청 보내기</button>
    </div>
    <div id="pList"></div>
  </section>

  <!-- 병원 화면 -->
  <section id="hospital" class="hidden">
    <div class="alarm hidden" id="hAlarm"></div>
    <p class="muted" id="hInfo"></p>
    <div id="hList"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const POLL_MS = 4000;
const RING_MS = 3000;            // 병원: 응답 전까지 이 간격으로 계속 알림
const CALL_SNOOZE_MS = 120000;   // '전화 확인' 응답 후 2분간만 알림을 멈춤
const ST_LABEL = { accept: '수용 가능', reject: '수용 불가', call: '전화 확인 필요' };
const ST_ORDER = { accept: 0, call: 1, reject: 2 };

let cfg = null;
let profile = load('par_profile', null);
let myIds = load('par_ids', []);
let seen = null;           // 병원: 이미 본 요청 id, 경찰관: 이미 본 응답 키
let polling = false;
let pollTimer = null;
let audioCtx = null;
let pendingCount = 0;      // 병원: 아직 수용 가능/불가로 답하지 않은 요청 수
let ringTimer = null;

const $ = (id) => document.getElementById(id);

/* ---------- 공통 ---------- */
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function call(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = 'none'), 3000);
}
function errMsg(e) { return (e && e.message) || String(e); }
function ago(ts, now) {
  const m = Math.floor((now - ts) / 60000);
  return m < 1 ? '방금' : m + '분 전';
}
function chips(el, name, list, type, checked) {
  el.innerHTML = list.map((v) =>
    `<label><input type="${type}" name="${name}" value="${esc(v)}"${checked.includes(v) ? ' checked' : ''}><span>${esc(v)}</span></label>`
  ).join('');
}
function checkedValues(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
}
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function alertUser(title) {
  beep();
  toast(title);
}
function beep() {
  try {
    if (audioCtx) {
      [0, 0.25, 0.5].forEach((d) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime + d);
        o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.15);
      });
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
}
document.addEventListener('click', unlockAudio, { once: false, passive: true });

/* ---------- 설정 화면 ---------- */
let pickedRole = null;
function showSetup() {
  stopPolling();
  ['police', 'hospital'].forEach((id) => $(id).classList.add('hidden'));
  $('setup').classList.remove('hidden');
  $('btnSettings').classList.add('hidden');
  $('who').textContent = '';
  chips($('sRegions'), 'sRegion', cfg.regions, 'checkbox', (profile && profile.regions) || []);
  $('setupCode').classList.toggle('hidden', !cfg.needsCode);
  if (profile) {
    $('sOfficer').value = profile.officer || '';
    $('sContact').value = profile.contact || '';
    $('sHospital').value = profile.name || '';
    $('sCode').value = profile.code || '';
    pickRole(profile.role);
  }
}
function pickRole(role) {
  pickedRole = role;
  document.querySelectorAll('.role button').forEach((b) => b.classList.toggle('on', b.dataset.role === role));
  $('setupPolice').classList.toggle('hidden', role !== 'police');
  $('setupHospital').classList.toggle('hidden', role !== 'hospital');
  $('btnStart').disabled = !role;
}
document.querySelectorAll('.role button').forEach((b) => (b.onclick = () => pickRole(b.dataset.role)));

$('btnStart').onclick = async () => {
  const p = { role: pickedRole, code: $('sCode').value.trim() };
  if (pickedRole === 'police') {
    p.officer = $('sOfficer').value.trim();
    p.contact = $('sContact').value.trim();
    if (!p.officer || !p.contact) return toast('소속/이름과 연락처를 입력하세요.');
  } else {
    p.name = $('sHospital').value.trim();
    p.regions = checkedValues('sRegion');
    if (!p.name) return toast('병원명을 입력하세요.');
  }
  $('btnStart').disabled = true;
  try {
    await call('verifyCode', p.code);
    profile = p;
    save('par_profile', p);
    enter();
  } catch (e) {
    toast(errMsg(e));
  } finally {
    $('btnStart').disabled = false;
  }
};
$('btnSettings').onclick = showSetup;

/* ---------- 역할별 화면 ---------- */
function enter() {
  $('setup').classList.add('hidden');
  $('btnSettings').classList.remove('hidden');
  seen = null;
  if (profile.role === 'police') {
    $('who').textContent = profile.officer;
    $('police').classList.remove('hidden');
    $('hospital').classList.add('hidden');
    chips($('pType'), 'pType', cfg.types, 'radio', [cfg.types[0]]);
    chips($('pRegion'), 'pRegion', cfg.regions, 'radio', [profile.lastRegion || cfg.regions[0]]);
  } else {
    $('who').textContent = profile.name;
    $('hospital').classList.remove('hidden');
    $('police').classList.add('hidden');
    $('hInfo').textContent = '수신 지역: ' + (profile.regions.length ? profile.regions.join(', ') : '전체') +
      ' · 응답(수용 가능/불가)할 때까지 소리·진동이 계속 울립니다. 화면을 켜 두고, 처음 한 번 화면을 터치해야 소리가 납니다.';
  }
  startPolling();
}

$('btnSend').onclick = async () => {
  const data = {
    type: checkedValues('pType')[0],
    region: checkedValues('pRegion')[0],
    condition: $('pCond').value,
    officer: profile.officer,
    contact: profile.contact,
  };
  if (!data.condition.trim()) return toast('환자 상태를 간단히 입력하세요.');
  $('btnSend').disabled = true;
  try {
    const req = await call('createRequest', profile.code, data);
    myIds.unshift(req.id);
    save('par_ids', myIds);
    profile.lastRegion = data.region;
    save('par_profile', profile);
    $('pCond').value = '';
    toast(`요청 ${req.id} 전송 완료. 병원 응답을 기다립니다.`);
    refresh();
  } catch (e) {
    toast(errMsg(e));
  } finally {
    $('btnSend').disabled = false;
  }
};

function renderPolice(data) {
  const now = data.now;
  const alive = data.items.map((r) => r.id);
  if (alive.length !== myIds.length) { myIds = myIds.filter((id) => alive.includes(id)); save('par_ids', myIds); }

  const keys = [];
  $('pList').innerHTML = data.items.map((r) => {
    const resps = Object.keys(r.responses).map((h) => Object.assign({ name: h }, r.responses[h]))
      .sort((a, b) => ST_ORDER[a.status] - ST_ORDER[b.status] || a.at - b.at);
    resps.forEach((x) => keys.push(r.id + '|' + x.name + '|' + x.status));
    const open = r.status === 'open';
    const rows = resps.map((x) => `
      <div class="resp">
        <span class="name">${esc(x.name)}${x.note ? `<br><span class="muted">${esc(x.note)}</span>` : ''}</span>
        <span class="st ${x.status}">${ST_LABEL[x.status]}</span>
        ${open && x.status === 'accept'
          ? `<button data-act="choose" data-id="${esc(r.id)}" data-h="${esc(x.name)}">이송 결정</button>` : ''}
      </div>`).join('');
    return `
      <div class="card ${open ? '' : 'done'}">
        <div class="req-head"><span class="req-id">요청 ${esc(r.id)}</span><span class="muted">${ago(r.createdAt, now)}</span></div>
        <div><span class="tag type">${esc(r.type)}</span><span class="tag">${esc(r.region)}</span></div>
        <div class="cond">${esc(r.condition)}</div>
        ${open
          ? `<div class="muted">병원 응답 ${resps.length}곳 · 수용 가능 ${resps.filter((x) => x.status === 'accept').length}곳</div>`
          : `<div class="banner ${r.chosen ? 'ok' : 'info'}">${r.chosen ? '✅ ' + esc(r.chosen) + ' 으로 이송 결정' : '요청 종료됨'}</div>`}
        ${rows || (open ? '<div class="resp muted">아직 응답한 병원이 없습니다…</div>' : '')}
        ${open ? `<div class="row"><button class="btn-line" data-act="cancel" data-id="${esc(r.id)}">요청 취소</button></div>` : ''}
      </div>`;
  }).join('') || '<p class="muted">진행 중인 요청이 없습니다.</p>';

  if (seen) {
    const fresh = keys.filter((k) => !seen.includes(k));
    if (fresh.length) alertUser('새 병원 응답이 도착했습니다.');
  }
  seen = keys;
}

$('pList').onclick = async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (!b) return;
  const chosen = b.dataset.act === 'choose' ? b.dataset.h : '';
  if (!chosen && !confirmInline(b)) return;
  b.disabled = true;
  try {
    await call('closeRequest', profile.code, b.dataset.id, chosen);
    toast(chosen ? `${chosen} 으로 이송 결정을 알렸습니다.` : '요청을 취소했습니다.');
    refresh();
  } catch (e) {
    toast(errMsg(e));
    b.disabled = false;
  }
};

// 브라우저 확인창 대신 버튼을 한 번 더 누르게 한다.
function confirmInline(b) {
  if (b.dataset.armed) return true;
  b.dataset.armed = '1';
  b.textContent = '한 번 더 누르면 취소됩니다';
  setTimeout(() => { delete b.dataset.armed; b.textContent = '요청 취소'; }, 3000);
  return false;
}

function renderHospital(data) {
  const now = data.now;
  const ids = data.items.filter((r) => r.status === 'open').map((r) => r.id);
  const fresh = seen ? ids.filter((id) => !seen.includes(id)) : [];
  // 수용 가능/불가로 답할 때까지 '응답 대기'로 본다. '전화 확인'은 잠시만 알림을 멈춘다.
  const isPending = (r) => r.status === 'open' &&
    (!r.mine || (r.mine.status === 'call' && now - r.mine.at > CALL_SNOOZE_MS));
  pendingCount = data.items.filter(isPending).length;
  $('hAlarm').textContent = `🚨 응답 대기 중인 요청 ${pendingCount}건 — 수용 가능/불가를 눌러 주세요`;
  $('hAlarm').classList.toggle('hidden', !pendingCount);
  updateRinging();
  $('hList').innerHTML = data.items.map((r) => {
    const open = r.status === 'open';
    const mine = r.mine;
    return `
      <div class="card ${open ? '' : 'done'} ${fresh.includes(r.id) ? 'new' : ''} ${isPending(r) ? 'pending' : ''}">
        <div class="req-head"><span class="req-id">요청 ${esc(r.id)}</span><span class="muted">${ago(r.createdAt, now)}</span></div>
        <div><span class="tag type">${esc(r.type)}</span><span class="tag">${esc(r.region)}</span></div>
        <div class="cond">${esc(r.condition)}</div>
        <div class="muted">${esc(r.officer)} · <a class="tel" href="tel:${esc(r.contact.replace(/[^0-9+]/g, ''))}">${esc(r.contact)}</a></div>
        <div class="muted">다른 병원 응답: 가능 ${r.counts.accept} · 불가 ${r.counts.reject} · 전화확인 ${r.counts.call}</div>
        ${mine ? `<div class="banner info">내 응답: <span class="st ${mine.status}">${ST_LABEL[mine.status]}</span></div>` : ''}
        ${open ? `
          <div class="actions">
            <button class="a-accept" data-id="${esc(r.id)}" data-st="accept">수용 가능</button>
            <button class="a-reject" data-id="${esc(r.id)}" data-st="reject">수용 불가</button>
            <button class="a-call" data-id="${esc(r.id)}" data-st="call">전화 확인</button>
          </div>`
        : `<div class="banner ${r.chosenIsMe ? 'ok' : 'info'}">${r.chosenIsMe ? '🚑 귀 병원으로 이송 결정되었습니다' : '요청 종료됨 (다른 병원 이송 또는 취소)'}</div>`}
      </div>`;
  }).join('') || '<p class="muted">현재 들어온 요청이 없습니다. 이 화면을 켜 두면 자동으로 표시됩니다.</p>';

  if (fresh.length) toast(`새 수용 요청 ${fresh.length}건이 도착했습니다.`);
  const chosenNow = data.items.filter((r) => r.chosenIsMe).map((r) => 'c' + r.id);
  if (seen && chosenNow.some((k) => !seen.includes(k))) alertUser('귀 병원으로 이송이 결정되었습니다.');
  seen = ids.concat(chosenNow);
}

function updateRinging() {
  const on = profile && profile.role === 'hospital' && pendingCount > 0 && pollTimer;
  if (on && !ringTimer) {
    beep();
    ringTimer = setInterval(beep, RING_MS);
    blinkTitle(true);
  } else if (!on && ringTimer) {
    clearInterval(ringTimer);
    ringTimer = null;
    blinkTitle(false);
  }
}
function blinkTitle(on) {
  clearInterval(blinkTitle.timer);
  document.title = '환자 수용 요청';
  if (on) blinkTitle.timer = setInterval(() =>
    (document.title = document.title.startsWith('🚨') ? '환자 수용 요청' : `🚨 응답 대기 ${pendingCount}건`), 1000);
}

$('hList').onclick = async (ev) => {
  const b = ev.target.closest('button[data-st]');
  if (!b) return;
  b.parentNode.querySelectorAll('button').forEach((x) => (x.disabled = true));
  try {
    await call('respond', profile.code, b.dataset.id, profile.name, b.dataset.st, '');
    toast(`'${ST_LABEL[b.dataset.st]}' 응답을 보냈습니다.`);
    refresh();
  } catch (e) {
    toast(errMsg(e));
    b.parentNode.querySelectorAll('button').forEach((x) => (x.disabled = false));
  }
};

/* ---------- 자동 갱신 ---------- */
async function refresh() {
  if (polling || !profile) return;
  polling = true;
  try {
    const view = profile.role === 'police'
      ? { role: 'police', ids: myIds }
      : { role: 'hospital', name: profile.name, regions: profile.regions };
    const data = await call('listRequests', profile.code, view);
    profile.role === 'police' ? renderPolice(data) : renderHospital(data);
  } catch (e) {
    toast('연결 오류: ' + errMsg(e));
  } finally {
    polling = false;
  }
}
function startPolling() {
  stopPolling();
  refresh();
  pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; updateRinging(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && pollTimer) refresh(); });

/* ---------- 시작 ---------- */
call('getConfig').then((c) => {
  cfg = c;
  if (profile && (!cfg.needsCode || profile.code)) enter();
  else showSetup();
}).catch((e) => toast('서버 연결 실패: ' + errMsg(e)));
</script>
</body>
</html>
